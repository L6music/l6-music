<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a10"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>L6 Music — Independent Sound</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><aside class="sidebar"><a class="brand" href="#home"><span class="mark">L6</span><span>MUSIC<small>INDEPENDENT SOUND</small></span></a><nav id="nav"><button data-page="home" class="active">⌂ <span>Home</span></button><button data-page="discover">⌕ <span>Discover</span></button><button data-page="artists">♬ <span>Artists</span></button><button data-page="library">♡ <span>Your Library</span></button><button data-page="upload">⊕ <span>Artist Studio</span></button></nav><div class="side-bottom">YOUR SOUND. YOUR SPACE.<small>Built for independent artists.</small></div></aside>
<main><header><button id="mobileMenu" aria-label="Toggle navigation">☰</button><div class="search">⌕ <input id="search" placeholder="Search tracks, artists, genres…" aria-label="Search music"></div><button class="upload-shortcut" data-page="upload">＋ Upload music</button></header><div id="content"></div></main></div>
<div class="player" id="player"><div class="now"><div class="cover mini" id="playerCover">L6</div><div class="track-meta"><strong id="nowTitle">Nothing playing</strong><small id="nowArtist">Choose a track to listen</small></div><button id="favBtn" title="Save to library" aria-label="Save to library">♡</button></div><div class="transport"><div class="controls"><button id="shuffleBtn" aria-label="Toggle shuffle" title="Shuffle">⇄</button><button id="prevBtn" aria-label="Previous">⏮</button><button id="playBtn" class="play" aria-label="Play or pause">▶</button><button id="nextBtn" aria-label="Next">⏭</button><button id="repeatBtn" aria-label="Toggle repeat" title="Repeat">↻</button></div><div class="progress"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek"><span id="duration">0:00</span></div></div><div class="volume">♫ <input id="volume" type="range" min="0" max="100" value="75" aria-label="Volume"></div></div>
<audio id="audio" preload="metadata"></audio><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
